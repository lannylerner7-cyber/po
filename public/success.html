<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment approved · POS</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --counter:#e8eaef; --ink:#14161b; --muted:#6b7280; --accent:#2e6be6; --ok:#1a9a62; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--counter) url("/backgrounds/soft-aurora.svg") center / cover no-repeat;
      color: var(--ink);
      font-family: "Space Grotesk", system-ui, sans-serif;
      padding: 2rem 1rem; text-align: center;
    }
    .card {
      width: min(400px, 100%); background: #fafbfc; border-radius: 20px;
      padding: 2.4rem 2rem 2.2rem;
      box-shadow: 0 24px 50px -22px rgba(20,22,27,.35);
    }
    h1 { font-size: 1.9rem; font-weight: 700; margin: 1rem 0 0.4rem; }
    p { color: var(--muted); line-height: 1.55; }
    .posid {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 1.2rem;
    }
    .posid[hidden] { display: none; }
    .posid code {
      font: 500 1rem "IBM Plex Mono", monospace;
      background: #eef0f3; border: 1px solid #e0e3e9;
      border-radius: 8px; padding: 0.4rem 0.7rem; letter-spacing: 0.04em;
    }
    .posid button {
      border: 1px solid #d7dbe2; background: #fff; color: var(--ink);
      font: 500 0.8rem "Space Grotesk", sans-serif;
      padding: 0.4rem 0.7rem; border-radius: 8px; cursor: pointer;
    }
    .posid button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .hint { margin-top: 0.6rem; font-size: 0.82rem; }
    .tag {
      display: inline-block; margin-top: 1rem;
      font: 500 0.78rem "IBM Plex Mono", monospace; letter-spacing: .12em;
      color: var(--ok);
    }
    a.newsale {
      display: inline-block; margin-top: 1.5rem; padding: 0.85rem 1.8rem;
      background: var(--accent); color: #fff; text-decoration: none;
      font-weight: 700; border-radius: 12px;
    }
    a.newsale:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="none" stroke="#1a9a62" stroke-width="4"/>
      <path d="M20 33 l8 8 l16 -18" fill="none" stroke="#1a9a62" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1 id="headline">Payment approved</h1>
    <p id="detail">The charge went through and a receipt is on its way.</p>
    <div class="posid" id="posid" hidden>
      <code id="pid-value"></code>
      <button type="button" id="pid-copy">Copy</button>
    </div>
    <p class="hint" id="pid-hint" hidden>Save this POS ID — track it any time with the terminal's Payment review.</p>
    <p class="summary" id="summary" hidden
       style="margin-top:0.9rem;font:500 0.95rem 'IBM Plex Mono',monospace;color:#14161b;"></p>
    <span class="tag" id="tag">TRANSACTION COMPLETE</span><br />
    <a class="newsale" href="/">Withdraw</a>
  </main>

  <script>
    const q = new URLSearchParams(location.search);
    const pid = (q.get('pid') || '').toUpperCase();
    const st = q.get('st') || 'succeeded';

    if (/^RE-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(pid)) {
      document.getElementById('pid-value').textContent = pid;
      document.getElementById('posid').hidden = false;
      document.getElementById('pid-hint').hidden = false;
      const copy = document.getElementById('pid-copy');
      copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(pid);
          copy.textContent = 'Copied';
          setTimeout(() => { copy.textContent = 'Copy'; }, 1600);
        } catch { copy.textContent = 'Select it'; }
      });
    }

    if (st === 'processing') {
      document.getElementById('headline').textContent = 'Payment processing';
      document.getElementById('detail').textContent =
        'Your payment is on its way — bank debits can take a few days to settle. Track it with your POS ID.';
      const tag = document.getElementById('tag');
      tag.textContent = 'PROCESSING';
      tag.style.color = '#2e6be6';
    }

    // Richer receipt: pull amount + note for this POS ID.
    if (/^RE-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(pid)) {
      fetch('/api/track/' + encodeURIComponent(pid))
        .then((r) => (r.ok ? r.json() : null))
        .then((tx) => {
          if (!tx) return;
          const label = tx.status === 'processing' ? 'Processing' : tx.status === 'refunded' ? 'Refunded' : 'Approved';
          const amount = (tx.amount_cents / 100).toLocaleString('en-US', {
            style: 'currency', currency: (tx.currency || 'usd').toUpperCase(),
          });
          const parts = [label, amount];
          if (tx.note) parts.push(tx.note);
          const el = document.getElementById('summary');
          el.textContent = parts.join(' \u00b7 ');
          el.hidden = false;
        })
        .catch(() => {});
    }

    // Approved chime: quick ascending three-tone (E5, G5, C6).
    function playApproved() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return false;
      const ctx = new Ctx();
      if (ctx.state === 'suspended') { ctx.close(); return false; }
      const notes = [659.25, 783.99, 1046.5];
      notes.forEach((f, i) => {
        const t = ctx.currentTime + i * 0.11;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.12, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + (i === 2 ? 0.4 : 0.16));
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + 0.45);
      });
      return true;
    }
    if (st !== 'processing' && !playApproved()) {
      // Browsers block audio until the page gets an interaction.
      const once = () => { playApproved(); removeEventListener('pointerdown', once); removeEventListener('keydown', once); };
      addEventListener('pointerdown', once); addEventListener('keydown', once);
    }
  </script>
</body>
</html>
